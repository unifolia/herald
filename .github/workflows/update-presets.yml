name: Pull openMIDI data

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild catalog from openMIDI
        run: npm run build:presets

      - name: Commit if changed
        run: |
          git add public/presetCatalog.json
          # --cached catches new/untracked files too (git diff alone ignores them).
          if git diff --cached --quiet; then
            echo "Catalog unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m ":alembic: pull openMIDI preset catalog (i'm a bot btw)"
          git push
